{% extends "base.html" %}
{% block title %}Register - ExpenseAI{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-name dark">ExpenseAI</div>
      <div class="brand-sub-dark">Smart Finance</div>
    </div>

    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Start tracking your spending intelligently</p>

    <form method="POST" action="{{ url_for('register') }}" class="auth-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required placeholder="Your name">

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="At least 6 characters">

      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password">

      <button type="submit" class="btn-primary btn-block">Register</button>
    </form>

    <p class="auth-footer-text">
      Already have an account? <a href="{{ url_for('login') }}">Login</a>
    </p>
  </div>
</div>
{% endblock %}
