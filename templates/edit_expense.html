{% extends "base.html" %}
{% block title %}Edit Expense - ExpenseAI{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Edit Expense</h1>
  <p>Update the details of this transaction</p>
</div>

<div class="card card-form">
  <form method="POST" action="{{ url_for('edit_expense', expense_id=expense.id) }}">
    <label for="description">Description</label>
    <input type="text" id="description" name="description" value="{{ expense.description }}" required>

    <label for="amount">Amount (₹)</label>
    <input type="number" id="amount" name="amount" step="0.01" min="0.01" value="{{ expense.amount }}" required>

    <label for="category">Category</label>
    <select id="category" name="category">
      {% for cat in categories %}
        <option value="{{ cat }}" {% if cat == expense.category %}selected{% endif %}>{{ cat }}</option>
      {% endfor %}
    </select>

    <label for="date">Date</label>
    <input type="date" id="date" name="date" value="{{ expense.date.isoformat() }}" required>

    <div class="form-actions">
      <button type="submit" class="btn-primary">Save Changes</button>
      <a href="{{ url_for('expenses') }}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
