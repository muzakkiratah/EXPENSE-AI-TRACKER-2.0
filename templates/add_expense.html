{% extends "base.html" %}
{% block title %}Add Expense - ExpenseAI{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Add Expense</h1>
  <p>Enter the details below - the category will be suggested automatically</p>
</div>

<div class="card card-form">
  <form method="POST" action="{{ url_for('add_expense') }}" id="expenseForm">
    <div class="form-grid-2">
      <div class="form-field">
        <label for="amount">Amount (₹)</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="0.00" required>
      </div>
      <div class="form-field">
        <label for="category">
          Category
          <span class="ai-suggested-tag" id="aiSuggestedTag" style="display:none;">AI Suggested</span>
        </label>
        <select id="category" name="category">
          {% for cat in categories %}
            <option value="{{ cat }}">{{ cat }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <label for="description">Description</label>
    <input type="text" id="description" name="description" placeholder="What did you spend money on?" required autocomplete="off">

    <label for="date">Date</label>
    <input type="date" id="date" name="date" value="{{ today }}" required>

    <button type="submit" class="btn-primary btn-block">Save Expense</button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Hooks used by script.js for automatic ML category prediction
  window.EXPENSEAI_PREDICT_URL = "{{ url_for('predict_category_api') }}";
</script>
{% endblock %}
